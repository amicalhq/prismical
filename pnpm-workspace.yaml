packages:
  - apps/*
  - packages/*
  # Native helper packages are nested one level deeper than packages/* reaches;
  # the whisper.cpp submodule content is never a workspace package.
  - packages/native-helpers/*
  - packages/whisper-wrapper/addon
  - '!packages/**/whisper.cpp/**'

catalog:
  # Shared dependency catalog — generated, do not edit by hand. Add the
  # dependency to the package that needs it; this block is rebuilt from the
  # packages' `catalog:` references.
  "@ai-sdk/anthropic": ^4.0.47
  "@ai-sdk/openai": ^4.0.45
  "@ai-sdk/openai-compatible": ^3.0.34
  "@paralleldrive/cuid2": ^2.2.2
  "@playwright/test": ^1.52.0
  "@types/node": ^24.13.3
  "@types/react": ^19.1.3
  "@types/react-dom": ^19.1.3
  ai: ^7.0.73
  drizzle-kit: 0.31.6
  drizzle-orm: 0.45.2
  eslint: ^9.39.1
  i18next: ^25.8.0
  react: ^19.1.0
  react-dom: ^19.1.0
  react-i18next: ^16.5.3
  tsx: ^4.19.4
  typescript: 5.8.3
  vitest: ^3.2.1
  zod: ^4.3.5

overrides:
  '@types/react': ^19.1.3
  '@types/react-dom': ^19.1.3

ignoredBuiltDependencies:
  # Ships binding.gyp (so pnpm classifies it as build-requiring) but no install
  # script and a prebuilt N-API binary per platform/arch inside the tarball —
  # never approve-builds it: node-gyp would drop the prebuild for a source build.
  - better-sqlite3

onlyBuiltDependencies:
  - electron
  # Squirrel maker (win32): its install script copies the arch-matched
  # bundled 7z (7z-x64.exe → 7z.exe); when blocked, Squirrel releasify dies
  # with Process.Start exit 4294967295 inside CreateZipFromDirectory.
  - electron-winstaller
  - esbuild
  # Native bindings for the macOS DMG maker (@electron-forge/maker-dmg →
  # electron-installer-dmg → appdmg). pnpm 10 blocks their implicit node-gyp
  # build by default; allow it so `appdmg` can load (else Forge #3517). Build/
  # packaging-only — not shipped in the app.
  - macos-alias
  - fs-xattr
